# Соседние библиотеки texport, которых нет в Maven Central в нужной версии.
#
# Кодек берёт протокол 2.0.4 (ofd-kt-proto-v204), а в Central его ещё нет.
# Протокол собирается из исходников ветки ниже и кладётся в локальное
# хранилище раннера под той версией, которую кодек просит в
# gradle/libs.versions.toml (ofdKtProtoV204), — публиковать ради сборки
# ничего не требуется. Клиент сети (ofd-network-client 1.2.1) в Central есть
# и берётся оттуда.
#
# Ветка протокола задаётся здесь и только здесь; её берут и проверка, и выпуск.
name: Соседние библиотеки из исходников
description: Собирает ofd-kt-proto из исходников в локальное хранилище Maven.

inputs:
  ofd-kt-proto-ref:
    description: Ветка или метка texport/ofd-kt-proto
    default: main

runs:
  using: composite
  steps:
    - name: Протокол
      uses: actions/checkout@v4
      with:
        repository: texport/ofd-kt-proto
        ref: ${{ inputs.ofd-kt-proto-ref }}
        path: .siblings/ofd-kt-proto

    - name: Протокол в локальное хранилище
      shell: bash
      run: |
        version=$(sed -n 's/^ofdKtProtoV204 = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
        test -n "$version" || { echo "::error::В libs.versions.toml нет ofdKtProtoV204"; exit 1; }
        cd .siblings/ofd-kt-proto
        ./gradlew publishToMavenLocal -PreleaseVersion="$version"
