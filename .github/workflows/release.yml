# Выпуск по метке v<версия>; метка обязана совпасть с версией в сборке.
#
# Порядок: проверки (ci.yml) и сборка файлов → выпуск на GitHub → Maven
# Central. Упала любая ступень — следующие не запускаются.
#
# Файлы выпуска: jar для JVM, aar для Android и OfdProtoCodec.xcframework.zip
# для iOS (Swift Package Manager берёт его по ссылке из Package.swift).
name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  artifacts:
    # XCFramework собирается только на macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - uses: ./.github/actions/siblings

      # Метка v1.3.1 при версии 1.3.0 в сборке выложила бы под чужим номером
      # другой код — и в Central его уже не заменить.
      - name: Метка совпадает с версией
        run: |
          version=$(./gradlew -q properties --property version | sed -n 's/^version: //p')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Метка $GITHUB_REF_NAME, а версия в сборке $version"
            exit 1
          fi
          case "$version" in *SNAPSHOT*) echo "::error::SNAPSHOT не выпускается"; exit 1 ;; esac

      - name: Собрать jar, aar и XCFramework
        run: ./gradlew jvmJar bundleAndroidMainAar generateSpmManifest

      # Package.swift в метке ссылается на архив этого выпуска и его сумму.
      # Сумма считается с архива, собранного здесь; если сборка Kotlin/Native
      # дала другой архив, чем у владельца, SPM по метке его не примет —
      # верная строка binaryTarget есть в заметках выпуска.
      - name: Сложить файлы выпуска
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp "build/libs/ofd-proto-codec-jvm-$version.jar" dist/
          cp build/outputs/aar/*.aar "dist/ofd-proto-codec-android-$version.aar"
          zip=build/XCFrameworks/release/OfdProtoCodec.xcframework.zip
          cp "$zip" dist/
          sum=$(shasum -a 256 "$zip" | cut -d' ' -f1)
          echo "$sum" > dist/OfdProtoCodec.xcframework.zip.sha256
          if ! git show HEAD:Package.swift | grep -q "$sum"; then
            echo "::warning::Package.swift в метке несёт другую сумму XCFramework; правильная: $sum"
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error

  github-release:
    needs: [ checks, artifacts ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Вся история с метками — для заметок о выпуске.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist

      # Заметки: файл RELEASE_NOTES.md в метке, а без него — сообщения
      # коммитов от предыдущей метки v*. Ниже — строка для Package.swift.
      - name: Заметки о выпуске
        run: |
          if [ -f RELEASE_NOTES.md ]; then
            cp RELEASE_NOTES.md notes.md
          else
            prev=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
            {
              if [ -n "$prev" ]; then echo "Изменения с $prev:"; else echo "Изменения:"; fi
              echo
              git log --no-merges --format='- %s' "${prev:+$prev..}${GITHUB_REF_NAME}"
            } > notes.md
          fi
          sum=$(cat dist/OfdProtoCodec.xcframework.zip.sha256)
          cat >> notes.md <<NOTES

          ## Swift Package Manager

          \`\`\`swift
          .binaryTarget(
              name: "OfdProtoCodec",
              url: "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/OfdProtoCodec.xcframework.zip",
              checksum: "${sum}"
          )
          \`\`\`
          NOTES
          cat notes.md

      # Выпуск мог быть заведён руками до сборки — тогда файлы докладываются
      # в него поверх прежних, а заметки остаются те, что написаны руками.
      - name: Выпуск на GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "ofd-proto-codec $GITHUB_REF_NAME" --notes-file notes.md dist/*
          fi

  # В Central — только после проверок и созданного выпуска на GitHub.
  # Без секретов работа падает с перечнем недостающих, выпуск на GitHub
  # при этом уже создан и не трогается; после заведения секретов её
  # достаточно перезапустить (Re-run failed jobs).
  maven-central:
    needs: [ checks, artifacts, github-release ]
    runs-on: macos-latest
    env:
      OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
      OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
    steps:
      - name: Секреты на месте
        run: |
          missing=""
          for name in OSSRH_USERNAME OSSRH_PASSWORD SIGNING_KEY SIGNING_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Maven Central::Не заведены секреты репозитория:$missing. Выпуск на GitHub создан и не тронут; заведите секреты и перезапустите эту работу."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - uses: ./.github/actions/siblings

      - name: Выгрузить в Maven Central
        run: ./gradlew publishAggregationToCentralPortal
