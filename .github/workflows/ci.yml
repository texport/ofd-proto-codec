# Проверка каждого изменения. Её же вызывает выпуск (release.yml): в выпуск
# и в Maven Central уходит только то, что прошло эту проверку.
#
# Файл один и тот же в протоколе, кодеке и ядре. Разнятся только версия JDK
# (из каталога версий), задача покрытия, шаг соседей (у протокола соседей
# нет) и шаг iOS-тестов (у ядра они выключены в сборке).
name: CI Build

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    # iOS-цели компилируются только на macOS.
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '17' # javaTargetCore в libs.versions.toml
          distribution: 'temurin'

      # Кэш v6 — закрытый компонент gradle-actions-caching: пользуясь им,
      # репозиторий принимает https://gradle.com/legal/terms-of-use/.
      # Условия приняты; отказ от них — cache-provider: basic.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced

      - name: Build Siblings from Sources
        uses: ./.github/actions/siblings

      # Автоправку detekt на CI выключает сама сборка (по переменной CI):
      # нарушение роняет проверку, а не переписывается молча.
      - name: Run Static Analysis (Detekt)
        run: ./gradlew detekt

      # iOS компилируется в klib одной цели — так ломка iosMain видна на
      # каждом изменении. XCFramework (три цели, связанные в бинарники)
      # нужен только выпуску и собирается там.
      - name: Compile JVM, Android and iOS
        run: ./gradlew jvmJar assembleAndroidMain compileKotlinIosArm64

      - name: Run Unit Tests
        run: ./gradlew jvmTest

      - name: Run Android Host Tests
        run: ./gradlew testAndroidHostTest

      - name: Run iOS Simulator Tests
        run: ./gradlew iosSimulatorArm64Test

      - name: Verify Code Coverage Thresholds
        run: ./gradlew koverVerify

      # Упала проверка — отчёты покрытия и тестов остаются у прогона:
      # без них расхождение CI с машиной разработчика не разобрать.
      - name: Keep Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/kover/
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7
