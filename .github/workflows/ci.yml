name: CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Checkout ofd-kt-proto
      uses: actions/checkout@v4
      with:
        repository: texport/ofd-kt-proto
        path: ofd-kt-proto

    - name: Checkout ofd-network-client
      uses: actions/checkout@v4
      with:
        repository: texport/ofd-network-client
        path: ofd-network-client

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Build & Publish dependencies to Maven Local
      run: |
        cd ofd-kt-proto
        chmod +x gradlew
        ./gradlew publishToMavenLocal
        cd ../ofd-network-client
        chmod +x gradlew
        ./gradlew publishToMavenLocal
        cd ..

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Detekt Static Analysis
      run: ./gradlew detekt

    - name: Build and Run Tests
      run: ./gradlew build
