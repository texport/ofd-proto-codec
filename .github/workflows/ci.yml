# Проверка каждого изменения. Её же вызывает выпуск по метке (release.yml):
# в выпуск и в Maven Central уходит только то, что прошло эту проверку.
name: CI Build

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    # iOS-цели и XCFramework собираются только на macOS.
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17' # javaTargetCore в libs.versions.toml
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Соседние библиотеки из исходников
        uses: ./.github/actions/siblings

      # Автоправку detekt на CI выключает сама сборка (по переменной CI):
      # нарушение роняет проверку, а не переписывается молча.
      - name: Run Detekt Static Analysis
        run: ./gradlew detekt

      - name: Build and Run Tests
        run: ./gradlew build
